name: E-commerce pipeline tests

on:
  push:
    paths:
      - "ecommerce-api-pipeline/**"
      - "tests/test_ecommerce_pipeline.py"
      - ".github/workflows/ecommerce-pipeline-tests.yml"
  pull_request:
    paths:
      - "ecommerce-api-pipeline/**"
      - "tests/test_ecommerce_pipeline.py"
      - ".github/workflows/ecommerce-pipeline-tests.yml"
  workflow_dispatch:

jobs:
  test-ecommerce-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: ecommerce-api-pipeline/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r ecommerce-api-pipeline/requirements.txt pytest
      - name: Run e-commerce pipeline tests
        run: python -m pytest -q tests/test_ecommerce_pipeline.py
