name: Sales pipeline tests

on:
  push:
    paths:
      - "sales-data-pipeline/**"
      - "tests/test_sales_pipeline.py"
      - ".github/workflows/sales-pipeline-tests.yml"
  pull_request:
    paths:
      - "sales-data-pipeline/**"
      - "tests/test_sales_pipeline.py"
      - ".github/workflows/sales-pipeline-tests.yml"
  workflow_dispatch:

jobs:
  test-sales-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: sales-data-pipeline/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r sales-data-pipeline/requirements.txt pytest
      - name: Run sales pipeline tests
        run: python -m pytest -q tests/test_sales_pipeline.py
