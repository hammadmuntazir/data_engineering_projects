name: GDP ETL tests

on:
  push:
    paths:
      - "IMF_GDP_ETL_Pipeline/**"
      - ".github/workflows/imf-gdp-etl-tests.yml"
  pull_request:
    paths:
      - "IMF_GDP_ETL_Pipeline/**"
      - ".github/workflows/imf-gdp-etl-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: IMF_GDP_ETL_Pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: IMF_GDP_ETL_Pipeline/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: pytest -q
